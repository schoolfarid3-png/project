<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayman El-Borai Photo Studio</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .header-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .header-title h1 {
            margin: 0;
            font-size: 22px;
            color: #4da6ff;
        }
        .header-title p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #b3b3b3;
            letter-spacing: 1px;
        }
        .viewer-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            display: flex;
            justify-content: center;
        }
        video {
            width: 100%;
            height: auto;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
        }
        .guide-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px dashed rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            box-sizing: content-box;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: #262626;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
        }
        button, select {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            background: #3a3a3a;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #4a4a4a; }
        button.primary { background: #0056b3; }
        button.primary:hover { background: #004085; }
        button.danger { background: #8b0000; }
        button.danger:hover { background: #660000; }
        .connection-panel {
            margin-top: 15px;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 80px;
            margin-top: 10px;
            background: #222;
            color: #0f0;
            font-family: monospace;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>برنامج أيمن البرعي</h1>
        <p>Ayman El-Borai Photo Studio</p>
    </div>

    <div class="viewer-container">
        <video id="preview" autoplay playsinline></video>
        <div id="guide" class="guide-frame"></div>
    </div>

    <div class="controls">
        <button id="start-btn" class="primary">تشغيل الكاميرا</button>
        <button id="capture-btn">التقاط صورة</button>
        <button id="disconnect-btn" class="danger">إنهاء الاتصال</button>
        
        <div>
            <label for="resolution">المقاس:</label>
            <select id="resolution">
                <option value="480x640" selected>افتراضي (480×640)</option>
                <option value="600x900">استمارة (600×900)</option>
                <option value="720x1280">عالي (720×1280)</option>
                <option value="1080x1920">فائق (1080×1920)</option>
            </select>
        </div>

        <div>
            <label for="format">الصيغة:</label>
            <select id="format">
                <option value="image/jpeg" selected>JPEG</option>
                <option value="image/png">PNG</option>
            </select>
        </div>
    </div>

    <div class="connection-panel">
        <div>
            <button id="offer-btn">إنشاء رمز الاتصال</button>
            <button id="answer-btn">تأكيد الرمز وبدء الاتصال</button>
        </div>
        <textarea id="sdp-data" placeholder="سيظهر هنا رمز الاتصال (SDP) للنسخ، أو الصق الرمز المستلم هنا..."></textarea>
    </div>

    <script>
        const video = document.getElementById('preview');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const resolutionSelect = document.getElementById('resolution');
        const formatSelect = document.getElementById('format');
        const guide = document.getElementById('guide');
        const offerBtn = document.getElementById('offer-btn');
        const answerBtn = document.getElementById('answer-btn');
        const sdpData = document.getElementById('sdp-data');

        let targetWidth = 480;
        let targetHeight = 640;
        let localStream;
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function updateGuideFrame() {
            const [w, h] = resolutionSelect.value.split('x').map(Number);
            targetWidth = w;
            targetHeight = h;
            
            const maxDimension = 300;
            let frameWidth, frameHeight;
            if (w >= h) {
                frameWidth = maxDimension;
                frameHeight = (h / w) * maxDimension;
            } else {
                frameHeight = maxDimension;
                frameWidth = (w / h) * maxDimension;
            }
            guide.style.width = `${frameWidth}px`;
            guide.style.height = `${frameHeight}px`;
        }

        resolutionSelect.addEventListener('change', updateGuideFrame);

        startBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = localStream;
                updateGuideFrame();
            } catch (err) {
                alert('تعذر الوصول للكاميرا.');
                console.error(err);
            }
        });

        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(config);

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                video.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate === null) {
                    sdpData.value = JSON.stringify(peerConnection.localDescription);
                }
            };
        }

        offerBtn.addEventListener('click', async () => {
            setupPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
        });

        answerBtn.addEventListener('click', async () => {
            if (!peerConnection) setupPeerConnection();
            try {
                const remoteDesc = new RTCSessionDescription(JSON.parse(sdpData.value));
                await peerConnection.setRemoteDescription(remoteDesc);
                
                if (peerConnection.localDescription.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                }
            } catch (err) {
                alert('خطأ في معالجة رمز الاتصال.');
                console.error(err);
            }
        });

        disconnectBtn.addEventListener('click', () => {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            sdpData.value = '';
            alert('تم إنهاء الاتصال.');
        });

        captureBtn.addEventListener('click', () => {
            if (!video.srcObject) return alert('شغل الكاميرا أولاً');
            
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
            
            const format = formatSelect.value;
            const extension = format.split('/')[1];
            const a = document.createElement('a');
            a.href = canvas.toDataURL(format, 0.95);
            a.download = `photo_${targetWidth}x${targetHeight}_${Date.now()}.${extension}`;
            a.click();
        });
    </script>
</body>
</html>
