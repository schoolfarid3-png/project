<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الحصص المدرسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --accent-color: #ffd700;
            --accent-glow: rgba(255, 215, 0, 0.25);
            --bg-dark: #0b0f17;
            --card-bg: #141b29;
            --input-bg: rgba(255, 255, 255, 0.09);
            --text-light: #ffffff;
            --text-muted: #e2e8f0;
            --border-color: rgba(255, 215, 0, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            padding: 16px;
            color: var(--text-light);
            min-height: 100vh;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 18px;
            border: 1.5px solid var(--border-color);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7), 0 0 24px var(--accent-glow);
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .return-btn-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .return-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .return-btn:hover {
            background: var(--accent-color);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        h2 {
            margin: 10px 0 20px 0;
            color: var(--accent-color);
            font-size: 28px;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .select-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 380px;
        }

        select {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-light);
            background-color: var(--input-bg);
            border: 1.5px solid rgba(255, 255, 255, 0.28);
            border-radius: 12px;
            appearance: none;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            font-family: inherit;
        }

        select:focus {
            border-color: var(--accent-color);
            background-color: rgba(255, 255, 255, 0.14);
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 12px;
            color: var(--accent-color);
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 18px;
            border: 1.5px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .day-header {
            background: linear-gradient(135deg, #1f2d47 0%, #141b29 100%);
            color: var(--accent-color);
            padding: 16px 20px;
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            border-bottom: 1.5px solid var(--border-color);
        }

        .day-header::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: var(--accent-color);
            border-radius: 4px;
            margin-left: 12px;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .table-wrapper-outer {
            position: relative;
        }

        .table-wrapper-outer::after {
            content: '← اسحب للمتابعة →';
            display: block;
            text-align: center;
            background: rgba(0,0,0,0.4);
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px;
            border-top: 1px dashed var(--accent-color);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }
        .table-responsive::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        .table-responsive::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
            background: var(--card-bg);
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 15px;
        }

        th {
            background-color: #1a233a;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .row-label {
            font-weight: 800;
            color: var(--accent-color);
            background-color: #1a233a;
            width: 90px;
            position: sticky;
            right: 0;
            z-index: 1;
            border-left: 2px solid var(--accent-color);
        }

        .period-num {
            font-weight: 900;
            color: var(--accent-color);
            background-color: #1a233a !important;
        }

        tbody tr:hover td:not(.row-label) {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .merged-cell {
            background-color: rgba(255, 215, 0, 0.08);
            color: #fff3c4;
            font-weight: 700;
        }

        .loading-state, .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 16px;
            background: var(--card-bg);
            border-radius: 18px;
            border: 1.5px solid var(--border-color);
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header-card { padding: 16px; }
            .return-btn-wrapper { position: static; margin-bottom: 15px; text-align: center; }
            h2 { font-size: 22px; margin-top: 5px; }
            th, td { padding: 10px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-card">
        <div class="return-btn-wrapper">
            <button class="return-btn" onclick="goBack()">
                <span>←</span> العودة للخدمات الرئيسية
            </button>
        </div>
        <h2>جدول الحصص المدرسي</h2>
        <div class="select-wrapper">
            <select id="classSelect" onchange="loadSchedule()">
                <option value="">-- جاري تحميل الفصول --</option>
            </select>
        </div>
    </div>

    <div id="scheduleContainer"></div>
</div>

<script>
    // استبدل الرابط أدناه برابط الـ Web App الخاص بك بعد نشره (Deploy) على جوجل
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxfmndYlrH9AEum65xWbX_3WTEdu2mh5kwAF1U5s2FuIJxko8gysrPPhwl1I3ih7iWeHA/exec";

    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = "index.html";
        }
    }

    async function fetchScheduleData(action, className = "") {
        try {
            const url = `${WEB_APP_URL}?action=${action}&className=${encodeURIComponent(className)}`;
            const response = await fetch(url);
            return await response.json();
        } catch (error) {
            console.error("Fetch error:", error);
            return null;
        }
    }

    window.onload = async function() {
        var classes = await fetchScheduleData("getClasses");
        if (classes) {
            populateDropdown(classes);
        } else {
            document.getElementById("classSelect").innerHTML = '<option value="">خطأ في تحميل الفصول</option>';
        }
    };

    function populateDropdown(classes) {
        var select = document.getElementById("classSelect");
        select.innerHTML = '<option value="">-- اختر الفصل --</option>';
        classes.forEach(function(item) {
            var opt = document.createElement("option");
            opt.value = item.className;
            opt.textContent = item.className;
            select.appendChild(opt);
        });
    }

    async function loadSchedule() {
        var className = document.getElementById("classSelect").value;
        var container = document.getElementById("scheduleContainer");
        if (!className) {
            container.innerHTML = "";
            return;
        }
        
        container.innerHTML = "<div class='loading-state'>جاري جلب البيانات وتنسيق الجدول...</div>";
        
        var result = await fetchScheduleData("getScheduleByClass", className);
        
        if (result && result.subjectRow && result.teacherRow && result.locationRow) {
            var daysConfig = [
                { name: "الأحد", start: 5, end: 14 },
                { name: "الاثنين", start: 15, end: 24 },
                { name: "الثلاثاء", start: 25, end: 34 },
                { name: "الأربعاء", start: 35, end: 44 },
                { name: "الخميس", start: 45, end: 54 }
            ];

            var html = "";
            
            daysConfig.forEach(function(day) {
                var colsCount = (day.end - day.start) + 1;
                
                var subjects = [];
                var teachers = [];
                var locations = [];
                for (var col = day.start; col <= day.end; col++) {
                    subjects.push(formatCell(result.subjectRow[col]));
                    teachers.push(formatCell(result.teacherRow[col]));
                    locations.push(formatCell(result.locationRow[col]));
                }

                var mergedSubjects = calculateMerges(subjects, teachers);

                html += "<div class='day-card'>";
                html += "<div class='day-header'>" + day.name + "</div>";
                html += "<div class='table-wrapper-outer'>";
                html += "<div class='table-responsive'>";
                html += "<table>";
                
                // صف أرقام الحصص
                html += "<thead><tr><th class='row-label'>الحصة</th>";
                for (var i = 1; i <= colsCount; i++) {
                    html += "<th class='period-num'>" + i + "</th>";
                }
                html += "</tr></thead>";

                html += "<tbody>";

                // صف المواد
                html += "<tr><td class='row-label'>المادة</td>";
                mergedSubjects.forEach(function(item) {
                    var cellClass = item.span > 1 ? "merged-cell" : "";
                    html += "<td colspan='" + item.span + "' class='" + cellClass + "'>" + item.value + "</td>";
                });
                html += "</tr>";

                // صف المعلمين
                html += "<tr><td class='row-label'>المعلم</td>";
                mergedSubjects.forEach(function(item) {
                    var cellClass = item.span > 1 ? "merged-cell" : "";
                    html += "<td colspan='" + item.span + "' class='" + cellClass + "'>" + item.teacher + "</td>";
                });
                html += "</tr>";

                // صف الأماكن
                var mergedLocations = calculateLocationMerges(locations, mergedSubjects);
                html += "<tr><td class='row-label'>المكان</td>";
                mergedLocations.forEach(function(item) {
                    var cellClass = item.span > 1 ? "merged-cell" : "";
                    html += "<td colspan='" + item.span + "' class='" + cellClass + "'>" + item.value + "</td>";
                });
                html += "</tr>";

                html += "</tbody></table>";
                html += "</div></div></div>";
            });
            
            container.innerHTML = html;
        } else {
            container.innerHTML = "<div class='empty-state'>لا توجد بيانات متاحة لهذا الفصل.</div>";
        }
    }

    function formatCell(val) {
        if (val === undefined || val === null || val === "") return "-";
        return val.toString().trim();
    }

    function calculateMerges(subjects, teachers) {
        var result = [];
        var n = subjects.length;
        if (n === 0) return result;

        var currentSub = subjects[0];
        var currentTea = teachers[0];
        var spanCount = 1;

        for (var i = 1; i < n; i++) {
            if (subjects[i] === currentSub && teachers[i] === currentTea && currentSub !== "-") {
                spanCount++;
            } else {
                result.push({ value: currentSub, teacher: currentTea, span: spanCount });
                currentSub = subjects[i];
                currentTea = teachers[i];
                spanCount = 1;
            }
        }
        result.push({ value: currentSub, teacher: currentTea, span: spanCount });
        return result;
    }

    function calculateLocationMerges(locations, mergedSubjects) {
        var result = [];
        var locIndex = 0;

        mergedSubjects.forEach(function(subGroup) {
            var span = subGroup.span;
            var firstLoc = locations[locIndex];
            var allSame = true;

            for (var i = 1; i < span; i++) {
                if (locations[locIndex + i] !== firstLoc) {
                    allSame = false;
                    break;
                }
            }

            if (allSame) {
                result.push({ value: firstLoc, span: span });
            } else {
                for (var i = 0; i < span; i++) {
                    result.push({ value: locations[locIndex + i], span: 1 });
                }
            }
            locIndex += span;
        });

        return result;
    }
</script>

</body>
</html>
